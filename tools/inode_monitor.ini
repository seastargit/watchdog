[check]
# Supported modes: tcp or http
# tcp: monitor a host:port via TCP connect
# http: monitor a URL by HTTP GET and accept 2xx/3xx responses
mode = http
# When mode = tcp, set host and port
host = 192.168.100.21
port = 5050
# When mode = http, set the full health URL here
http_url = http://192.168.100.21:5050/Login.aspx
# Seconds between checks
interval = 30
# Seconds for socket connect timeout / HTTP request timeout
connect_timeout = 5
# Number of consecutive failures before sending alert
failure_threshold = 3
# Whether to send a recovery notification when the host becomes reachable again
notify_recovery = yes

[notification]
# Supported channels: email, dingtalk, wecom, all, or a comma-separated list like email,dingtalk,wecom
channel = email,dingtalk,wecom
# Optional subject prefix reused for all notification channels
subject_prefix = [INode VPN监控]

[email]
# SMTP server configuration
smtp_host = smtp.qq.com
smtp_port = 587
# If using authenticated SMTP, set username/password
username = 
password = 
# Use STARTTLS
use_tls = yes
# Use SSL (SMTPS) instead of STARTTLS. If yes, use_ssl takes precedence over use_tls
use_ssl = no
from = 
# Comma-separated recipient list
to = 

[dingtalk]
# DingTalk robot webhook URL, e.g. https://oapi.dingtalk.com/robot/send?access_token=... 
webhook_url = 
# Optional secret for signing robot webhook messages
secret = 
# Optional mobiles to @, comma-separated
at_mobiles = 
# Set to yes to @ all
is_at_all = yes

[wecom]
# WeCom group robot webhook URL, e.g. https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=... 
webhook_url = https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=
# Optional mobiles to mention, comma-separated
mentioned_mobiles = 
# Set to yes to mention everyone in the group
mentioned_all = yes

[process_monitor]
# Check processes every N seconds
check_interval_seconds = 3
[processes]
gpsserver.exe=D:\project\佛广项目\svn\gpsserver\Release\gpsserver.exe
NRDVRPlayer=D:\project\佛广项目\NRDVRPlayer\Release\发布\NRDVRPlayer.exe

[log_cleanup]
# Directory containing logs to clean up
 directory = D:\project\佛广项目\svn\gpsserver\Release
# Glob pattern for files to remove
 pattern = *.log,*.txt
# Keep files newer than keep_days
 keep_days = 7
# How often to run cleanup (hours)
 interval_hours = 24

[logging]
# Optional log file path (if omitted logs go to stdout)
# file = /var/log/inode_monitor.log
level = INFO
