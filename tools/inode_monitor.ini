[check]
# Host and port to monitor (TCP connect)
host = 127.0.0.1
port = 8080
# Seconds between checks
interval = 30
# Seconds for socket connect timeout
connect_timeout = 5
# Number of consecutive failures before sending alert
failure_threshold = 3
# Whether to send a recovery email when the host becomes reachable again
notify_recovery = yes

[email]
# SMTP server configuration
smtp_host = smtp.example.com
smtp_port = 587
# If using authenticated SMTP, set username/password
username = 
password = 
# Use STARTTLS
use_tls = yes
# Use SSL (SMTPS) instead of STARTTLS. If yes, use_ssl takes precedence over use_tls
use_ssl = no
from = monitor@example.com
# Comma-separated recipient list
to = ops@example.com, admin@example.com
# Optional subject prefix
subject_prefix = [iNode Monitor]

[logging]
# Optional log file path (if omitted logs go to stdout)
# file = /var/log/inode_monitor.log
level = INFO
